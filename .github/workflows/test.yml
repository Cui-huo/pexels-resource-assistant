# GitHub Actions 测试工作流
# 每次推送到 main 分支或创建 Pull Request 时自动运行

name: CI - 自动化测试

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CI_MODE: '1'  # 启用 CI 模式，只测试代码导入，不测试配置有效性

jobs:
  test:
    runs-on: windows-latest

    steps:
    # 步骤 1: 检出代码
    - name: 📥 检出代码
      uses: actions/checkout@v4

    # 步骤 2: 设置 Python 环境
    - name: 🐍 设置 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 步骤 3: 安装依赖
    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 步骤 4: 运行环境测试脚本（CI 模式）
    - name: 🧪 运行环境测试
      run: |
        echo "CI_MODE value: $env:CI_MODE"
        python -c "import os; print('CI_MODE in Python:', os.getenv('CI_MODE'))"
        $env:CI_MODE='1'; python test_setup.py
      shell: pwsh

    # 步骤 5: 输出测试总结
    - name: ✅ 测试完成
      run: |
        echo "=========================================="
        echo "🎉 所有自动化测试完成！"
        echo "=========================================="
      shell: cmd
