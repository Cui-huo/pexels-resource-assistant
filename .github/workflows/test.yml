# GitHub Actions 测试工作流
# 每次推送到 main 分支或创建 Pull Request 时自动运行

name: CI - 自动化测试

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    # 步骤 1: 检出代码
    - name: 📥 检出代码
      uses: actions/checkout@v4

    # 步骤 2: 设置 Python 环境
    - name: 🐍 设置 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 步骤 3: 安装依赖
    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 步骤 4: 创建测试配置文件
    - name: ⚙️ 创建测试配置
      run: |
        copy .env.example .env
      shell: cmd

    # 步骤 5: 运行环境测试脚本
    - name: 🧪 运行环境测试
      run: |
        python test_setup.py
      shell: cmd
      continue-on-error: true  # 配置验证可能失败（因为使用占位值），但不阻止后续步骤

    # 步骤 6: 测试核心模块导入
    - name: 🔧 测试核心模块导入
      run: |
        echo "测试 download_and_send 模块..."
        python -c "from download_and_send.config import PEXELS_API_KEY; print('config.py OK')"
        python -c "from download_and_send.download_pictures_and_videos import get_popular_photos; print('download_pictures_and_videos.py OK')"
        python -c "from download_and_send.send_email import send_email; print('send_email.py OK')"
        python -c "from download_and_send.main import main; print('main.py OK')"
      shell: cmd

    # 步骤 7: 测试独立脚本导入
    - name: 📜 测试独立脚本导入
      run: |
        echo "测试独立脚本..."
        python -c "import download_pictures; print('download_pictures.py OK')"
        python -c "import download_video_from_pexels; print('download_video_from_pexels.py OK')"
        python -c "import email_extend; print('email_extend.py OK')"
      shell: cmd

    # 步骤 8: 输出测试总结
    - name: ✅ 测试完成
      run: |
        echo "=========================================="
        echo "🎉 所有自动化测试完成！"
        echo "=========================================="
      shell: cmd
