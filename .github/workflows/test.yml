# GitHub Actions 测试工作流
# 每次推送到 main 分支或创建 Pull Request 时自动运行
# 
# 注意：只做静态代码检查，不调用任何外部 API

name: CI - 自动化测试

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    # 步骤 1: 检出代码
    - name: 📥 检出代码
      uses: actions/checkout@v4

    # 步骤 2: 设置 Python 环境
    - name: 🐍 设置 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 步骤 3: 安装依赖
    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 步骤 4: 语法检查（编译所有 Python 文件）
    - name: 🔍 Python 语法检查
      run: |
        echo "Checking Python syntax..."
        python -m py_compile download_pictures.py
        python -m py_compile download_video_from_pexels.py
        python -m py_compile email_extend.py
        python -m py_compile send_email_.py
        python -m py_compile send_email_pictures_from_pexels.py
        python -m py_compile send_my_email.py
        python -m py_compile download_from_pexels.py
        python -m py_compile test_setup.py
        
        cd download_and_send
        python -m py_compile config.py
        python -m py_compile download_pictures_and_videos.py
        python -m py_compile send_email.py
        python -m py_compile main.py
        python -m py_compile __init__.py
        
        echo "All Python files passed syntax check!"
      shell: cmd

    # 步骤 5: 导入测试（仅加载模块，不执行主代码）
    - name: 🧩 模块导入测试
      env:
        # 设置占位符环境变量，避免配置缺失导致导入失败
        PEXELS_API_KEY: "test_key"
        EMAIL_SENDER: "test@test.com"
        EMAIL_PASSWORD: "test_password"
      run: |
        echo "Testing module imports (without executing main code)..."
        
        # 测试独立脚本（这些脚本在 import 时不会自动执行）
        python -c "import download_pictures; print('✓ download_pictures.py')"
        python -c "import download_video_from_pexels; print('✓ download_video_from_pexels.py')"
        python -c "import email_extend; print('✓ email_extend.py')"
        
        # 测试 download_and_send 模块
        cd download_and_send
        python -c "import config; print('✓ config.py')"
        python -c "import download_pictures_and_videos; print('✓ download_pictures_and_videos.py')"
        python -c "import send_email; print('✓ send_email.py')"
        
        echo "All modules imported successfully!"
      shell: cmd

    # 步骤 6: 输出测试总结
    - name: ✅ 测试完成
      run: |
        echo "=========================================="
        echo "🎉 所有自动化测试完成！"
        echo "   - 语法检查：通过"
        echo "   - 模块导入：通过"
        echo "=========================================="
      shell: cmd
