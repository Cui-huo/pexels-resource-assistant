# GitHub Actions 测试工作流
# 每次推送到 main 分支或创建 Pull Request 时自动运行

name: CI - 自动化测试

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    # 步骤 1: 检出代码
    - name: 📥 检出代码
      uses: actions/checkout@v4

    # 步骤 2: 设置 Python 环境
    - name: 🐍 设置 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 步骤 3: 安装依赖
    - name: 📦 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 步骤 4: 测试核心模块导入
    - name: 🔧 测试核心模块导入
      run: |
        echo "Testing config.py..."
        python -c "from download_and_send.config import PEXELS_API_KEY; print('OK')"
        
        echo "Testing download_pictures_and_videos.py..."
        python -c "from download_and_send.download_pictures_and_videos import get_popular_photos; print('OK')"
        
        echo "Testing send_email.py..."
        python -c "from download_and_send.send_email import send_email; print('OK')"
        
        echo "Testing main.py..."
        python -c "from download_and_send.main import main; print('OK')"
      shell: cmd

    # 步骤 5: 测试独立脚本导入
    - name: 📜 测试独立脚本导入
      run: |
        echo "Testing download_pictures.py..."
        python -c "import download_pictures; print('OK')"
        
        echo "Testing download_video_from_pexels.py..."
        python -c "import download_video_from_pexels; print('OK')"
        
        echo "Testing email_extend.py..."
        python -c "import email_extend; print('OK')"
      shell: cmd

    # 步骤 6: 运行 test_setup.py（仅检查，不决定成败）
    - name: 🧪 运行环境测试（信息性）
      run: |
        python test_setup.py || echo "Note: test_setup.py returned non-zero (expected without user config)"
      shell: cmd
      continue-on-error: true

    # 步骤 7: 输出测试总结
    - name: ✅ 测试完成
      run: |
        echo "=========================================="
        echo "🎉 所有自动化测试完成！"
        echo "=========================================="
      shell: cmd
